<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ============================================================
    Exercício 01 — Apresentação Pessoal

    Disciplina: FrontEnd (Desenvolvimento Web)

  <!-- Codificação de caracteres da página (padrão UTF-8) -->
  <meta charset="UTF-8">
  <!-- Ajusta a página para se adaptar a telas de diferentes tamanhos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Título exibido na aba do navegador -->
  <title>Pablo Gustavo</title>
</head>

<body>
  <!-- Cabeçalho da página: identifica o autor -->
  <header>
    <h1>"Hello, My name is Pablo Gustavo"</h1>

  <!-- Conteúdo principal da página -->
  <main>
    <!-- Seção de apresentação profissional -->
    <section>
      <h2>About me</h2>
      <p>I am a Python Developer and Arch Linux Fanatic</p>
      <p>I really hate Windows</p>
    </section>

    <!-- Seção de animes favoritos (lista ordenada) -->

      <h2>My 3 favorite animes</h2>
      <ol>
        <li>Initial D</li>
        <li>Konosuba</li>
        <li>Pokémon Alola</li>
      </ol>
    </section>

    <!-- Seção com link externo e imagem -->
    <section>
      <p>To access Google, click <a href="https://google.com">here</a></p>
      <!--
        Imagem hospedada em um site externo;
        o atributo alt descreve o conteúdo dela para acessibilidade.
      -->

  <footer>
